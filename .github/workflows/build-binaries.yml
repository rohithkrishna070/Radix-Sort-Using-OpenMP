name: Build Linux Binaries
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libomp-dev mpich libmpich-dev
      - name: Create bin directory
        run: mkdir -p c-code/bin
      - name: Compile Serial
        run: gcc c-code/radix_serial.c -o c-code/bin/radix_serial -O2 -fopenmp -static -lm
      - name: Compile Parallel
        run: gcc c-code/radix_parallel.c -o c-code/bin/radix_parallel -O2 -fopenmp -static -lm
      - name: Compile MPI
        run: mpicc c-code/radix_mpi.c -o c-code/bin/radix_mpi -O2 -lm
      - name: Make executable
        run: chmod +x c-code/bin/*
      - name: Test binaries
        continue-on-error: true
        run: |
          printf "8\n170,45,75,90,802,24,2,66\n" | ./c-code/bin/radix_serial
          printf "8\n170,45,75,90,802,24,2,66\n" | ./c-code/bin/radix_parallel
          printf "8\n170,45,75,90,802,24,2,66\n" | mpirun -np 2 ./c-code/bin/radix_mpi || true
      - name: Commit binaries
        continue-on-error: true
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add c-code/bin/
          git diff --cached --quiet || git commit -m 'chore: update pre-compiled Linux binaries'
          git push || echo "Push skipped or not permitted"
